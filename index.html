<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed Toson</title>
<meta name="description" content="Software QA Engineer → AI for work. Testing AI before you trust it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b24;
    --row: #1a222d;
    --line: #263040;
    --text: #e6edf3;
    --muted: #8b98a9;
    --green: #3ddc84;
    --accent: #f5c518;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font: 400 15px/1.5 Inter, system-ui, sans-serif;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  main { width: 100%; max-width: 460px; }

  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .avatar {
    flex: none; width: 64px; height: 64px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--green);
    display: grid; place-items: center; overflow: hidden; position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar span { font: 700 22px "JetBrains Mono", monospace; color: var(--green); display: none; }
  .head h1 { font-size: 21px; font-weight: 700; }
  .head p { color: var(--muted); font-size: 13.5px; }
  .head p b { color: var(--accent); font-weight: 600; }

  .suite { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .suite-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    font: 500 12.5px "JetBrains Mono", monospace; color: var(--muted);
  }
  .suite-top .file { color: var(--text); }
  .suite-top .file i { color: var(--accent); margin-right: 6px; }
  .progress { height: 3px; background: var(--line); }
  .progress div { height: 100%; width: 0; background: var(--green); transition: width .35s ease; box-shadow: 0 0 12px var(--green); }

  .tests { list-style: none; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .tests a {
    display: grid; grid-template-columns: 26px 22px 1fr auto; align-items: center; gap: 10px;
    padding: 13px 12px; border-radius: 10px; background: var(--row);
    color: var(--text); text-decoration: none; border: 1px solid transparent;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .tests a:hover, .tests a:focus-visible { border-color: rgba(61,220,132,.5); transform: translateX(3px); outline: none; }
  .status { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; }
  .pending .status { border: 2px solid var(--line); }
  .running .status { border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  .pass .status { background: var(--green); color: #07240f; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(.3); } }
  .tests .ico { text-align: center; font-size: 17px; color: var(--muted); transition: color .2s; }
  .pass .ico { color: var(--text); }
  .tests .name { font-weight: 500; }
  .tests .name small { display: block; color: var(--muted); font: 500 11.5px "JetBrains Mono", monospace; }
  .tests .ms { font: 500 11.5px "JetBrains Mono", monospace; color: var(--muted); }
  .pass .ms { color: var(--green); }
  .pending { opacity: .45; }

  .summary {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; border-top: 1px solid var(--line);
    font: 500 12.5px "JetBrains Mono", monospace; color: var(--muted);
  }
  .summary .ok { color: var(--green); }
  .stamp {
    font: 700 12px "JetBrains Mono", monospace; letter-spacing: 1.5px;
    color: var(--accent); border: 2px solid var(--accent); border-radius: 6px;
    padding: 3px 8px; transform: rotate(-6deg) scale(0); opacity: 0;
  }
  .done .stamp { animation: stamp .45s cubic-bezier(.3,1.7,.5,1) forwards; }
  @keyframes stamp { to { transform: rotate(-6deg) scale(1); opacity: 1; } }

  .motto { text-align: center; margin-top: 26px; font: 700 14px "JetBrains Mono", monospace; }
  .motto span { color: var(--accent); }
  .rerun {
    display: block; margin: 14px auto 0; background: none; border: 1px solid var(--line);
    color: var(--muted); border-radius: 999px; padding: 7px 14px; cursor: pointer;
    font: 500 12px "JetBrains Mono", monospace;
  }
  .rerun:hover { color: var(--green); border-color: var(--green); }
  @media (max-width: 380px) { .tests .ms { display: none; } .tests a { grid-template-columns: 26px 22px 1fr; } }
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="avatar"><img src="photo.jpg" alt="Ahmed Toson"><span>AT</span></div>
    <div>
      <h1>Ahmed Toson</h1>
      <p>Software QA Engineer <b>→</b> AI for work</p>
    </div>
  </div>

  <section class="suite" id="suite">
    <div class="suite-top"><span class="file"><i class="fa-solid fa-flask"></i>ahmed-toson.spec</span><span id="count">0 / 0</span></div>
    <div class="progress"><div id="bar"></div></div>
    <ul class="tests" id="tests"></ul>
    <div class="summary"><span id="sum">running tests…</span><span class="stamp">VERIFIED</span></div>
  </section>

  <p class="motto"><span>✓</span> Testing AI before you trust it</p>
  <button class="rerun" id="rerun" type="button"><i class="fa-solid fa-rotate-right"></i> run again</button>
</main>

<script>
  // Edit links here.
  const LINKS = [
    { name: 'Instagram', icon: 'fa-brands fa-instagram', handle: '@ahmed_toson_ai', url: 'https://www.instagram.com/ahmed_toson_ai/' },
    { name: 'TikTok',    icon: 'fa-brands fa-tiktok',    handle: '@ahmed_toson_ai', url: 'https://www.tiktok.com/@ahmed_toson_ai' },
    { name: 'YouTube',   icon: 'fa-brands fa-youtube',   handle: '@AhmedToson-Ai',  url: 'https://www.youtube.com/@AhmedToson-Ai' },
    { name: 'Facebook',  icon: 'fa-brands fa-facebook',  handle: 'Ahmed Toson',     url: 'https://www.facebook.com/profile.php?id=61594294016274' },
    { name: 'LinkedIn',  icon: 'fa-brands fa-linkedin',  handle: 'Ahmed Toson',     url: 'https://www.linkedin.com/in/ahmed-toson-b79ab0220' },
    { name: 'GitHub',    icon: 'fa-brands fa-github',    handle: '@ahmed4toson',    url: 'https://github.com/ahmed4toson' },
    { name: 'CodePals Academy', icon: 'fa-solid fa-code', handle: 'founder · @codepalsai', url: 'https://codepaslsai.com/' },
  ];

  // Avatar fallback.
  const img = document.querySelector('.avatar img');
  const noPhoto = () => { img.remove(); document.querySelector('.avatar span').style.display = 'block'; };
  img.onerror = noPhoto; if (img.complete && img.naturalWidth === 0) noPhoto();

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  const list = document.getElementById('tests'), bar = document.getElementById('bar');
  const count = document.getElementById('count'), sum = document.getElementById('sum'), suite = document.getElementById('suite');
  let running = false;

  async function run() {
    if (running) return; running = true;
    suite.classList.remove('done'); bar.style.width = '0'; sum.textContent = 'running tests…';
    list.innerHTML = LINKS.map(l => `
      <li><a class="pending" href="${l.url}" target="_blank" rel="noopener">
        <span class="status"></span><i class="ico ${l.icon}"></i>
        <span class="name">${l.name}<small>${l.handle}</small></span><span class="ms"></span>
      </a></li>`).join('');
    const rows = [...list.querySelectorAll('a')];
    count.textContent = `0 / ${rows.length}`;
    await wait(400);
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      r.className = 'running';
      const ms = 8 + Math.floor(Math.random() * 40);
      await wait(380 + Math.random() * 260);
      r.className = 'pass';
      r.querySelector('.status').innerHTML = '<i class="fa-solid fa-check"></i>';
      r.querySelector('.ms').textContent = ms + 'ms';
      bar.style.width = ((i + 1) / rows.length * 100) + '%';
      count.textContent = `${i + 1} / ${rows.length}`;
    }
    await wait(200);
    sum.innerHTML = `<span class="ok">${rows.length} passed</span> · 0 failed`;
    suite.classList.add('done');
    running = false;
  }

  document.getElementById('rerun').addEventListener('click', run);
  run();
</script>
</body>
</html>
