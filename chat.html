<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed Toson</title>
<meta name="description" content="Software QA Engineer → AI for work. Testing AI before you trust it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --bg: #f6f3ec;
    --card: #ffffff;
    --navy: #14144a;
    --text: #1c1c33;
    --muted: #6b6b85;
    --me: #14144a;
    --ai: #ffffff;
    --line: #e6e1d6;
    --accent: #f5c518;
    --green: #1f9d55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background-color: var(--bg);
    background-image: radial-gradient(#e2dccf 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--text); font: 400 15px/1.55 Inter, system-ui, sans-serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .app {
    width: 100%; max-width: 440px; background: var(--card);
    border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 20px 60px rgba(20,20,74,.12);
    display: flex; flex-direction: column; overflow: hidden; min-height: 640px;
  }
  .top { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .avatar {
    flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
    background: var(--navy); display: grid; place-items: center; position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar span { color: var(--accent); font: 700 15px "JetBrains Mono", monospace; display: none; }
  .online { position: absolute; right: 1px; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: #2ecc71; border: 2px solid #fff; }
  .top h1 { font-size: 16px; font-weight: 700; }
  .top p { font-size: 12.5px; color: var(--muted); }

  .chat { flex: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 11px 14px; border-radius: 18px; animation: in .35s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes in { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  .me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 6px; }
  .ai { align-self: flex-start; background: #f3f1ff; border: 1px solid #e4e1fb; border-bottom-left-radius: 6px; }
  .ai .who { display: block; font: 700 11px "JetBrains Mono", monospace; color: #6c63d9; margin-bottom: 3px; letter-spacing: .5px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #9a94e6; animation: bounce 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .links a {
    display: flex; align-items: center; gap: 9px; padding: 10px 11px;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px;
    animation: in .3s ease both; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .links a:hover, .links a:focus-visible { transform: translateY(-2px); border-color: var(--navy); box-shadow: 0 6px 16px rgba(20,20,74,.12); outline: none; }
  .links a i { font-size: 17px; width: 18px; text-align: center; }
  .links a.wide { grid-column: 1 / -1; }
  .fa-instagram { color: #d6249f; } .fa-tiktok { color: #111; } .fa-youtube { color: #ff0000; }
  .fa-facebook { color: #1877f2; } .fa-linkedin { color: #0a66c2; } .fa-github { color: #181717; } .fa-code { color: var(--navy); }

  .check {
    align-self: flex-start; max-width: 90%;
    background: #fffbea; border: 1.5px dashed var(--accent); border-radius: 14px;
    padding: 11px 14px; font-size: 14px; position: relative; animation: in .35s ease both;
  }
  .check b { font: 700 11px "JetBrains Mono", monospace; letter-spacing: .5px; color: #8a6d00; display: block; margin-bottom: 3px; }
  .badge {
    position: absolute; top: -12px; right: -10px; background: var(--green); color: #fff;
    font: 700 10.5px "JetBrains Mono", monospace; letter-spacing: 1px;
    padding: 4px 8px; border-radius: 6px; transform: rotate(8deg) scale(0);
    animation: stamp .45s .35s cubic-bezier(.3,1.7,.5,1) forwards;
  }
  @keyframes stamp { to { transform: rotate(8deg) scale(1); } }

  .bottom { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .bottom .fake {
    flex: 1; border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px;
    color: var(--muted); font-size: 13.5px; background: #faf9f6;
  }
  .bottom button {
    flex: none; width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--navy); color: var(--accent); font-size: 15px;
  }
  .bottom button:hover { background: #24246e; }
  @media (max-width: 380px) { .links { grid-template-columns: 1fr; } .app { min-height: 600px; } }
</style>
</head>
<body>
<div class="app" role="main">
  <div class="top">
    <div class="avatar"><img src="photo.jpg" alt="Ahmed Toson"><span>AT</span><i class="online"></i></div>
    <div><h1>Ahmed Toson</h1><p>Software QA Engineer → AI for work</p></div>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="bottom">
    <div class="fake">Testing AI before you trust it</div>
    <button id="replay" type="button" aria-label="Replay conversation"><i class="fa-solid fa-rotate-right"></i></button>
  </div>
</div>

<script>
  // Edit links here.
  const LINKS = [
    { name: 'Instagram', icon: 'fa-brands fa-instagram', url: 'https://www.instagram.com/ahmed_toson_ai/' },
    { name: 'TikTok',    icon: 'fa-brands fa-tiktok',    url: 'https://www.tiktok.com/@ahmed_toson_ai' },
    { name: 'YouTube',   icon: 'fa-brands fa-youtube',   url: 'https://www.youtube.com/@AhmedToson-Ai' },
    { name: 'Facebook',  icon: 'fa-brands fa-facebook',  url: 'https://www.facebook.com/profile.php?id=61594294016274' },
    { name: 'LinkedIn',  icon: 'fa-brands fa-linkedin',  url: 'https://www.linkedin.com/in/ahmed-toson-b79ab0220' },
    { name: 'GitHub',    icon: 'fa-brands fa-github',    url: 'https://github.com/ahmed4toson' },
    { name: 'CodePals Academy', icon: 'fa-solid fa-code', url: 'https://codepaslsai.com/', wide: true },
  ];

  const img = document.querySelector('.avatar img');
  const noPhoto = () => { img.remove(); document.querySelector('.avatar span').style.display = 'block'; };
  img.onerror = noPhoto; if (img.complete && img.naturalWidth === 0) noPhoto();

  const chat = document.getElementById('chat');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  let token = 0;

  function add(cls, html) {
    const d = document.createElement('div'); d.className = cls; d.innerHTML = html; chat.appendChild(d); return d;
  }
  async function aiSay(html, t) {
    const b = add('msg ai', '<span class="who">AI</span><span class="typing"><i></i><i></i><i></i></span>');
    await wait(900); if (t !== token) return null;
    b.innerHTML = '<span class="who">AI</span>' + html; return b;
  }

  async function play() {
    const t = ++token; chat.innerHTML = '';
    await wait(300);
    add('msg me', 'Who is Ahmed Toson?'); await wait(500); if (t !== token) return;
    await aiSay('A <b>Software QA Engineer</b> who shows you how to use AI at work, and how to catch it when it\'s wrong. He\'s also the founder of CodePals Academy.', t);
    await wait(900); if (t !== token) return;
    add('msg me', 'Where can I follow him?'); await wait(500); if (t !== token) return;
    const b = await aiSay('Here you go:<div class="links"></div>', t); if (!b) return;
    const box = b.querySelector('.links');
    for (const l of LINKS) {
      box.insertAdjacentHTML('beforeend', `<a class="${l.wide ? 'wide' : ''}" href="${l.url}" target="_blank" rel="noopener"><i class="${l.icon}"></i>${l.name}</a>`);
      await wait(120); if (t !== token) return;
    }
    await wait(800); if (t !== token) return;
    add('check', '<b>QA CHECK · AHMED</b>I tested this answer before you trusted it. All links work.<span class="badge">✓ VERIFIED</span>');
  }

  document.getElementById('replay').addEventListener('click', play);
  play();
</script>
</body>
</html>
